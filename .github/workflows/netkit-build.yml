name: NetKit Android — verified Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout private NetKit repository
        uses: actions/checkout@v4

      - name: Extract NetKit source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          matches = sorted(root.glob("NetKit_Android_Source_v0.6*.zip"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one NetKit_Android_Source_v0.6*.zip in repo root; found: {[p.name for p in matches]}")
          with ZipFile(matches[0]) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              prefix = 'NetKit_Android_v0.6/'
              if not any(n == prefix+'settings.gradle.kts' for n in names):
                  raise SystemExit('Archive does not contain the expected NetKit Android project root')
              for member in names:
                  if not member.startswith(prefix):
                      raise SystemExit(f'Unexpected ZIP entry: {member}')
                  relative = Path(member[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsafe ZIP entry: {member}')
                  dest = root / relative
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(member))
          print(f'Extracted {len(names)} NetKit source files from {matches[0].name}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK platform 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Provision Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate official Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          fi
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x gradlew
          ./gradlew --version

      - name: Static QA
        run: python3 qa/check_static.py

      - name: Kotlin JVM integration QA
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v kotlinc >/dev/null 2>&1; then
            curl -fsSL -o /tmp/kotlin-compiler.zip 'https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip'
            mkdir -p /tmp/netkit-kotlin
            unzip -q /tmp/kotlin-compiler.zip -d /tmp/netkit-kotlin
            echo /tmp/netkit-kotlin/kotlinc/bin >> "$GITHUB_PATH"
            export PATH="/tmp/netkit-kotlin/kotlinc/bin:$PATH"
          fi
          kotlinc -version
          bash qa/run_jvm_tests.sh

      - name: Build Android Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Verify APK signing and identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.netkit.local'" apk-badging.txt
          sha256sum "$APK"

      - name: Package verified outputs
        run: python3 tools/package_verified_build.py

      - name: Upload APK, source ZIP, checksum and reports
        uses: actions/upload-artifact@v4
        with:
          name: NetKit-v0.6.0-alpha-build1
          path: |
            dist/NetKit_v0.6.0-alpha-debug.apk
            dist/NetKit_Android_Source_v0.6-build1.zip
            dist/SHA256SUMS.txt
            apk-badging.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30
