name: NetKit Android - development build and verification

on:
  push:
    branches: [main, feature/netkit-pro-delivery-m1-m5, feature/netkit-reliability-20261023]
    paths:
      - 'app/**'
      - 'qa/**'
      - 'tools/**'
      - 'gradle/**'
      - '.github/workflows/netkit-import-build.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
  pull_request:
    branches: [main, feature/netkit-pro-delivery-m1-m5, feature/netkit-reliability-20261023]
    paths:
      - 'app/**'
      - 'qa/**'
      - 'tools/**'
      - 'gradle/**'
      - '.github/workflows/netkit-import-build.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

# A newer development commit supersedes earlier CI builds.
concurrency:
  group: netkit-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Confirm existing Android source
        run: |
          test -f app/src/main/java/com/netkit/local/ui/NetKitProApp.kt
          test -f app/src/main/java/com/netkit/local/share/SharedDirectoryBrowser.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK installed on hosted runner
        run: test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Create and check official Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          fi
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x gradlew
      - name: Provide Kotlin JVM compiler
        shell: bash
        run: |
          set -euo pipefail
          if command -v kotlinc; then kotlinc -version; exit 0; fi
          curl -fL --retry 3 "https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip" -o "$RUNNER_TEMP/kotlinc.zip"
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Static QA
        run: python3 qa/check_static.py
      - name: Kotlin/JVM transport QA
        run: bash qa/run_jvm_tests.sh
      - name: Verify persistent transfer queue JVM state machine
        shell: bash
        run: |
          set -euo pipefail
          kotlinc app/src/main/java/com/netkit/local/transfer/TransferQueue.kt qa/TransferQueueTest.kt -include-runtime -d /tmp/netkit-transfer-queue.jar
          java -jar /tmp/netkit-transfer-queue.jar "$RUNNER_TEMP"
      - name: Recursive folder ZIP streaming JVM QA
        shell: bash
        run: |
          set -euo pipefail
          kotlinc app/src/main/java/com/netkit/local/share/DirectoryArchive.kt qa/DirectoryArchiveTest.kt -include-runtime -d "$RUNNER_TEMP/zip-tests.jar"
          java -jar "$RUNNER_TEMP/zip-tests.jar"
      - name: Assemble Android debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/netkit-build.log"
      - name: Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee "$RUNNER_TEMP/netkit-lint.log"
      - name: Verify APK signing and Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.netkit.local'" apk-badging.txt
      - name: Package APK, source and SHA-256
        run: python3 tools/package_verified_build.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetKit-development-debug
          path: |
            dist/NetKit_v0.6.0-alpha-debug.apk
            dist/NetKit_Android_Source_v0.6-build1.zip
            dist/SHA256SUMS.txt
            apk-badging.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30
