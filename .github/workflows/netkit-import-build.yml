name: NetKit Android - source import and verified APK

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/netkit-source.tar.xz.b64'
      - '.github/workflows/netkit-import-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verified-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore original NetKit source
        shell: bash
        run: |
          set -euo pipefail
          test -s bootstrap/netkit-source.tar.xz.b64
          base64 --decode bootstrap/netkit-source.tar.xz.b64 > "$RUNNER_TEMP/netkit-source.tar.xz"
          echo "9408596be213ac9018bdaa33f5ad1018c0578f65ab0facc049b78a0b8f45baaf  $RUNNER_TEMP/netkit-source.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/netkit-source.tar.xz"
          test -f app/src/main/java/com/netkit/local/ui/NetKitApp.kt
          python3 -m pip install --user pillow
          python3 tools/generate_launcher_icons.py
          # The Actions token cannot introduce an additional workflow file.
          # Keep the preinstalled verified-build workflow as the sole workflow.
          rm -f .github/workflows/android-debug.yml
      - name: Save complete source and original icons to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "netkit-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore NetKit Android v0.6 sources and Liquid Aurora icons"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Create and check official Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          fi
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x gradlew
          git add gradlew gradlew.bat gradle/wrapper
          if ! git diff --cached --quiet; then
            git commit -m "Add official verified Gradle 8.13 wrapper"
            git push origin HEAD:main
          fi
      - name: Provide Kotlin JVM compiler
        shell: bash
        run: |
          set -euo pipefail
          if command -v kotlinc; then kotlinc -version; exit 0; fi
          curl -fL --retry 3 "https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip" -o "$RUNNER_TEMP/kotlinc.zip"
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Static QA
        run: python3 qa/check_static.py
      - name: Kotlin/JVM transport QA
        run: bash qa/run_jvm_tests.sh
      - name: Assemble Android debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/netkit-build.log"
      - name: Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee "$RUNNER_TEMP/netkit-lint.log"
      - name: Verify APK signing and Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.netkit.local'" apk-badging.txt
      - name: Package APK, source and SHA-256
        run: python3 tools/package_verified_build.py
      - name: Publish APK and sources to private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.6.0-alpha-build1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "NetKit v0.6.0 Alpha Build 1" --notes "Verified CI Debug APK. Device testing remains required." --prerelease
          fi
          gh release upload "$TAG" dist/*.apk dist/*.zip dist/SHA256SUMS.txt --clobber
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetKit-v0.6.0-alpha-build1
          path: |
            dist/NetKit_v0.6.0-alpha-debug.apk
            dist/NetKit_Android_Source_v0.6-build1.zip
            dist/SHA256SUMS.txt
            apk-badging.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30
      - name: Publish build outcome and log excerpt
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "# NetKit CI build result"
            echo
            echo "- Result: $BUILD_RESULT"
            echo "- Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Verified release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v0.6.0-alpha-build1 (only if successful)"
            echo
            echo '## Build log tail'
            echo '~~~'
            if [[ -f "$RUNNER_TEMP/netkit-build.log" ]]; then tail -n 90 "$RUNNER_TEMP/netkit-build.log"; else echo 'Build was not reached.'; fi
            echo '~~~'
            echo
            echo '## Lint log tail'
            echo '~~~'
            if [[ -f "$RUNNER_TEMP/netkit-lint.log" ]]; then tail -n 70 "$RUNNER_TEMP/netkit-lint.log"; else echo 'Lint was not reached.'; fi
            echo '~~~'
          } > CI_BUILD_STATUS.md
          git config user.name "netkit-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI_BUILD_STATUS.md
          git commit -m "Record NetKit CI outcome: $BUILD_RESULT" || true
          git push origin HEAD:main || true
