name: Independent Codex Developer (NetKit Android)
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: autonomous-dev-netkit-android
  cancel-in-progress: false
jobs:
  develop:
    # Do not start paid AI work until explicitly enabled in repository Variables.
    if: ${{ vars.AUTONOMOUS_DEV_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout approved development base
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate API connection without exposing credentials
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_KEY" ]]; then
            echo "::error::Configure OPENAI_API_KEY in repository Actions secrets."
            exit 1
          fi
      - name: Avoid overwriting a pending developer pull request
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --head automation/codex-development --state open --json number --jq 'length')"
          if [[ "$count" != "0" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Existing review PR is pending. No second agent branch is written."
          fi
          if grep -q '^AUTOMATION_COMPLETE: VERIFIED$' docs/AUTONOMOUS_ACCEPTANCE.md 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Previously verified completion. No new changes."
          fi
      - name: Codex development iteration
        if: steps.pending.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: docs/AUTONOMOUS_DEVELOPER.md
          sandbox: workspace-write
          output-file: /tmp/autonomous-codex-result.md
      - name: Separate second-pass acceptance audit
        if: steps.pending.outputs.skip != 'true'
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if grep -q '^AUTOMATION_COMPLETE: CANDIDATE$' docs/AUTONOMOUS_ACCEPTANCE.md 2>/dev/null; then
            echo "run_recheck=true" >> "$GITHUB_ENV"
          fi
      - name: Independent Codex recheck after candidate status
        if: steps.pending.outputs.skip != 'true' && env.run_recheck == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            Act as an INDEPENDENT skeptical release auditor, not the developer.
            Read docs/AUTONOMOUS_DEVELOPER.md and docs/AUTONOMOUS_ACCEPTANCE.md.
            Reconstruct original requirements from authoritative repo materials.
            Repeat actual build/tests, inspect source for fabricated or missing features,
            regressions, performance, user workflows and negative/security cases.
            Change ONLY docs/AUTONOMOUS_ACCEPTANCE.md: mark
            AUTOMATION_COMPLETE: VERIFIED solely when ALL needed original
            user requirements and platform acceptance are evidenced, or
            AUTOMATION_COMPLETE: BLOCKED with precise unmet items otherwise.
            Never fake device tests or claim a release that was not built.
      - name: Verify patch hygiene
        if: steps.pending.outputs.skip != 'true'
        run: |
          git diff --check
          if git status --porcelain | grep -E '(^|/)(\.env|secrets?\.json|id_rsa|\.pem)( |$)' ; then
            echo "::error::Potential secret-bearing file detected; refusing PR."
            exit 1
          fi
      - name: Propose changes for review — never auto-merge
        if: steps.pending.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/codex-development
          commit-message: "Autonomous development iteration with acceptance evidence"
          title: "Autonomous development: next verified milestone (NetKit Android)"
          body: |
            Draft AI-assisted development change. **Not automatically release-ready.**
            Review docs/AUTONOMOUS_ACCEPTANCE.md for implemented features,
            new tests, unverified claims, and exact remaining requirements.
            CI from a GITHUB_TOKEN-created PR may need a separately authorized trigger.
          draft: true
          delete-branch: false
